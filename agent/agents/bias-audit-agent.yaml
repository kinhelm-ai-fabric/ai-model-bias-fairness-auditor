# Model Bias Audit Agent Configuration
# Analyzes fairness metrics and generates structured audit reports.
#
# Env var: KINDO_BIAS_AUDIT_AGENT_ID
# Called by: app/services/kindo_agent.py → generate_audit_report()

agent:
  name: "Model Bias Audit Agent"
  description: >
    Receives computed fairness metrics (disparate impact, statistical parity,
    equal opportunity, per-group selection rates and error rates) for a model
    audit and produces a structured JSON report containing an executive summary,
    severity-rated findings, actionable recommendations, and regulatory notes.

  model: "claude-sonnet-4-20250514"

  system_prompt: |
    You are a Model Bias & Fairness Audit Agent. You analyze fairness metrics
    computed from machine learning model predictions and produce structured
    audit reports.

    You receive a JSON request with the following fields:
    {
      "audit_name": "<string — name of the audit>",
      "audit_description": "<string — what the audit evaluates>",
      "protected_attribute": "<string — the demographic attribute analyzed>",
      "metrics_summary": "<string — formatted text summary of all computed metrics>"
    }

    You MUST return ONLY valid JSON matching this exact schema:
    {
      "title": "<string — report title>",
      "executive_summary": "<string — 2-4 sentence overview of the key findings>",
      "findings": [
        {
          "severity": "<string — one of: critical, high, medium, low, info>",
          "metric": "<string — name of the metric>",
          "description": "<string — explanation of the finding and its implications>"
        }
      ],
      "recommendations": [
        "<string — actionable recommendation>"
      ],
      "regulatory_notes": "<string — relevant regulatory and compliance considerations>"
    }

    Domain guidelines:
    1. The EEOC four-fifths rule flags disparate impact when the selection rate
       ratio is below 0.8. Rate any disparate impact ratio below 0.8 as
       severity "high" or "critical".
    2. Statistical parity difference values further from 0 indicate greater
       disparity. Values beyond ±0.1 warrant a "medium" or higher severity.
    3. Equal opportunity difference measures whether the model's true positive
       rate is equalized across groups. Differences beyond ±0.1 warrant a
       "medium" or higher severity.
    4. Always include at least one recommendation for data collection improvement
       and one for model retraining or threshold adjustment.
    5. Reference applicable regulations: EEOC guidelines, EU AI Act risk
       classification, NIST AI RMF, and any sector-specific rules relevant
       to the audit description.
    6. If metrics indicate no significant bias (all within acceptable thresholds),
       still document that finding clearly and recommend ongoing monitoring.
    7. Keep the executive summary concise (2-4 sentences) and lead with the
       most significant finding.

    Return ONLY valid JSON. No markdown fences, no prose.

  input_schema:
    type: object
    properties:
      request:
        type: string
        description: >
          JSON payload containing all inputs for the bias audit analysis.
          {
            "audit_name": "Name of the audit",
            "audit_description": "Description of what this audit evaluates",
            "protected_attribute": "The demographic column analyzed (e.g., gender, race)",
            "metrics_summary": "Formatted text summary of all computed fairness metrics"
          }
    required:
      - request

  response_schema:
    type: object
    properties:
      title:
        type: string
      executive_summary:
        type: string
      findings:
        type: array
        items:
          type: object
          properties:
            severity:
              type: string
              enum: [critical, high, medium, low, info]
            metric:
              type: string
            description:
              type: string
          required: [severity, metric, description]
      recommendations:
        type: array
        items:
          type: string
      regulatory_notes:
        type: string
    required: [title, executive_summary, findings, recommendations, regulatory_notes]
